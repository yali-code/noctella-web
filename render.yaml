# Noctella ERP - Render Blueprint for the RC staging environment (deploys `main`; not pinned to a
# specific release candidate - see docs/releases/ for the capabilities of a given tag).
#
# Scope: RC staging infrastructure only, per Sprint 69 (see docs/deployment/render-staging.md
# for the full ordered deployment runbook and explicit non-goals). Deliberately uses SQLite on a
# single persistent disk and local product-photo storage - PostgreSQL/Supabase and object
# storage remain out of scope for this staging pass and are not introduced here.
#
# No real secret values are set in this file. Every credential is either Render-generated
# (generateValue: true, never appears in the repo or the Render dashboard's YAML view) or
# operator-supplied (sync: false, entered manually in the Render dashboard after the Blueprint
# is created - see the runbook, step 4).

services:
  # --- A. API web service --------------------------------------------------------------------
  - type: web
    name: noctella-staging-api
    runtime: node
    region: frankfurt
    branch: main
    plan: starter
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    disk:
      name: noctella-staging-data
      mountPath: /var/data
      sizeGB: 1
    domains:
      - api.staging.noctella.com
    envVars:
      # Non-secret configuration
      - key: NODE_ENV
        value: production
      - key: DATABASE_DRIVER
        value: sqlite
      - key: DATABASE_URL
        value: /var/data/noctella.sqlite
      - key: PRODUCT_PHOTO_DIR
        value: /var/data/product-photos
      - key: ADMIN_APP_ORIGIN
        value: https://admin.staging.noctella.com
      - key: STOREFRONT_APP_ORIGIN
        value: https://shop.staging.noctella.com
      - key: COOKIE_DOMAIN
        value: .staging.noctella.com
      - key: ERP_CLIENT_VERSION
        value: 0.1.0
      # Sprint 76: explicit, deliberate opt-in - every payment provider is currently a mock (see
      # .env.example), and the default with this unset would be to reject mock payments here
      # since NODE_ENV=production above. This staging environment intentionally keeps the mock
      # checkout demo flow usable; this must never be copied into a real production deployment
      # before a real payment gateway is integrated.
      - key: MOCK_PAYMENTS_ENABLED
        value: "true"
      # Sprint 105: "openai" is now the intended persistent staging provider after a successful
      # controlled smoke test. Provider selection is owned by this repository/Blueprint value;
      # a durable rollback to Mock must change this value back to "mock" here. Dashboard-only
      # overrides may be overwritten by a future Blueprint sync. The API key remains operator-managed
      # through `sync: false` below.
      - key: AI_INTAKE_PROVIDER
        value: openai
      - key: AI_INTAKE_OPENAI_MODEL
        value: gpt-4o-mini
      - key: AI_INTAKE_OPENAI_MAX_PHOTOS
        value: "5"
      # Sprint 108: activates the already-implemented real OpenAI Marketplace Preparation
      # provider (Sprint 107) in staging, reusing the existing AI_INTAKE_OPENAI_API_KEY/
      # AI_INTAKE_OPENAI_MODEL credential above - no new secret. Provider selection is owned by
      # this repository/Blueprint value for the same reason as AI_INTAKE_PROVIDER above:
      # dashboard-only overrides may be overwritten by a future Blueprint sync. A durable
      # rollback to Mock must change this value back to "mock" here.
      - key: MARKETPLACE_PREP_PROVIDER
        value: openai
      # Render-generated secrets - random values created by Render, never written to this file
      # or committed to source control. Verify the generated MARKETPLACE_CREDENTIAL_ENCRYPTION_KEY
      # actually decodes to 32 bytes (see runbook risk note) before relying on marketplace
      # credential encryption in staging.
      - key: ERP_INTEGRATION_KEY
        generateValue: true
      - key: ERP_INTEGRATION_KEY_SALT
        generateValue: true
      - key: SCHEDULER_AUTH_TOKEN
        generateValue: true
      - key: MARKETPLACE_CREDENTIAL_ENCRYPTION_KEY
        generateValue: true
      # Operator-supplied secrets - entered manually in the Render dashboard after Blueprint
      # creation (sync: false). Never set real values here.
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_REDIRECT_URI
        sync: false
      - key: EBAY_WEBHOOK_SECRET
        sync: false
      - key: ETSY_CLIENT_ID
        sync: false
      - key: ETSY_REDIRECT_URI
        sync: false
      - key: ETSY_WEBHOOK_SECRET
        sync: false
      - key: AI_INTAKE_OPENAI_API_KEY
        sync: false
      # Sprint 124: API-owned off-disk SQLite backup. These values are consulted only when the
      # authenticated backup operation runs, not during normal API startup. Retention is owned by
      # the destination lifecycle policy outside the application.
      - key: DATABASE_BACKUP_S3_ENDPOINT
        sync: false
      - key: DATABASE_BACKUP_S3_REGION
        sync: false
      - key: DATABASE_BACKUP_S3_BUCKET
        sync: false
      - key: DATABASE_BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: DATABASE_BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: DATABASE_BACKUP_S3_PREFIX
        value: database-backups
      - key: DATABASE_BACKUP_S3_FORCE_PATH_STYLE
        sync: false
      # Sprint 125: separate off-disk canonical product-photo backup destination. Consulted only
      # by the API-owned backup/recovery-verification operations; the HTTP cron receives none of
      # these values. Remote photo objects and manifests are never deleted by the application.
      - key: PRODUCT_PHOTO_BACKUP_S3_ENDPOINT
        sync: false
      - key: PRODUCT_PHOTO_BACKUP_S3_REGION
        sync: false
      - key: PRODUCT_PHOTO_BACKUP_S3_BUCKET
        sync: false
      - key: PRODUCT_PHOTO_BACKUP_S3_ACCESS_KEY_ID
        sync: false
      - key: PRODUCT_PHOTO_BACKUP_S3_SECRET_ACCESS_KEY
        sync: false
      - key: PRODUCT_PHOTO_BACKUP_S3_PREFIX
        value: product-photo-backups
      - key: PRODUCT_PHOTO_BACKUP_S3_FORCE_PATH_STYLE
        sync: false

  # --- B. Admin web service -------------------------------------------------------------------
  - type: web
    name: noctella-staging-admin
    runtime: node
    region: frankfurt
    branch: main
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/admin
    # apps/admin's own "start" script hardcodes -p 3001 for local dev - bypassed here so the
    # service binds to the port Render assigns via $PORT instead.
    startCommand: cd apps/admin && npx next start -p $PORT
    domains:
      - admin.staging.noctella.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.staging.noctella.com
      - key: ERP_CLIENT_VERSION
        value: 0.1.0
      - key: ERP_INTEGRATION_KEY
        fromService:
          name: noctella-staging-api
          type: web
          envVarKey: ERP_INTEGRATION_KEY

  # --- C. Storefront web service --------------------------------------------------------------
  - type: web
    name: noctella-staging-storefront
    runtime: node
    region: frankfurt
    branch: main
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/storefront
    # apps/storefront's own "start" script hardcodes -p 3000 for local dev - bypassed here so
    # the service binds to the port Render assigns via $PORT instead.
    startCommand: cd apps/storefront && npx next start -p $PORT
    domains:
      - shop.staging.noctella.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.staging.noctella.com
      # Sprint 73: server-only canonical origin for generateMetadata/sitemap.ts/robots.ts - the
      # established real domain for this service, matching the `domains` entry above.
      - key: STOREFRONT_SITE_URL
        value: https://shop.staging.noctella.com

  # --- D. Background-job cron service -----------------------------------------------------------
  - type: cron
    name: noctella-staging-background-jobs
    runtime: node
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 * * * *"
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: node apps/api/dist/scripts/runBackgroundJobs.js
    envVars:
      # Render private networking: resolves to the API service's internal host:port, never a
      # public onrender.com hostname - the cron job never leaves Render's private network.
      - key: API_HOSTPORT
        fromService:
          name: noctella-staging-api
          type: web
          property: hostport
      - key: SCHEDULER_AUTH_TOKEN
        fromService:
          name: noctella-staging-api
          type: web
          envVarKey: SCHEDULER_AUTH_TOKEN

  # --- E. Database backup trigger ---------------------------------------------------------------
  # Makes one authenticated API call daily at 03:00 UTC. It has no disk and no S3 credentials;
  # only the API process opens SQLite and uploads the verified backup.
  - type: cron
    name: noctella-staging-database-backup
    runtime: node
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 3 * * *"
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: node apps/api/dist/scripts/runDatabaseBackup.js
    envVars:
      - key: API_HOSTPORT
        fromService:
          name: noctella-staging-api
          type: web
          property: hostport
      - key: SCHEDULER_AUTH_TOKEN
        fromService:
          name: noctella-staging-api
          type: web
          envVarKey: SCHEDULER_AUTH_TOKEN

  # --- F. Product-photo backup trigger ---------------------------------------------------------
  # Makes one authenticated API call daily at 04:30 UTC. It has no disk, database/photo paths,
  # or S3 credentials; only the API process enumerates and reads authoritative ProductPhotos.
  - type: cron
    name: noctella-staging-product-photo-backup
    runtime: node
    region: frankfurt
    branch: main
    autoDeployTrigger: checksPass
    schedule: "30 4 * * *"
    buildCommand: npm ci --include=dev && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: node apps/api/dist/scripts/runProductPhotoBackup.js
    envVars:
      - key: API_HOSTPORT
        fromService:
          name: noctella-staging-api
          type: web
          property: hostport
      - key: SCHEDULER_AUTH_TOKEN
        fromService:
          name: noctella-staging-api
          type: web
          envVarKey: SCHEDULER_AUTH_TOKEN
