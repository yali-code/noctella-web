name: CI

on:
  pull_request:
    branches: [main, feat/photo-upload-bounded-memory-p2-2b1, feat/shared-image-admission-p2-2b2, feat/ai-intake-memory-p2-2b2b, feat/photo-crash-recovery-p2-2b3, fix/photo-postgres-timestamps-p2-2b3b]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: noctella_test
          POSTGRES_PASSWORD: noctella_test_password
          POSTGRES_DB: noctella_sprint151_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noctella_test -d noctella_sprint151_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w packages/shared

      - name: Disposable photo operation fencing design experiments
        timeout-minutes: 5
        env:
          POSTGRES_TEST_DATABASE_URL: postgres://noctella_test:noctella_test_password@127.0.0.1:5432/noctella_sprint151_test
          NOCTELLA_PROBE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NOCTELLA_FENCE_EVIDENCE_DIR: ${{ runner.temp }}/photo-fence-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NOCTELLA_FENCE_EVIDENCE_DIR"
          node --import tsx --test scripts/photo-operation-fencing/fencing.test.cjs 2>&1 | tee "$NOCTELLA_FENCE_EVIDENCE_DIR/test-output.txt"

      - name: Synthetic photo crash/restart recovery (SQLite and PostgreSQL)
        id: photo-recovery
        if: success() || failure()
        timeout-minutes: 10
        env:
          POSTGRES_TEST_DATABASE_URL: postgres://noctella_test:noctella_test_password@127.0.0.1:5432/noctella_sprint151_test
          NOCTELLA_PROBE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          NOCTELLA_CRASH_EVIDENCE_DIR: ${{ runner.temp }}/photo-crash-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$NOCTELLA_CRASH_EVIDENCE_DIR"
          node --import tsx --test scripts/photo-crash-recovery/recovery.test.cjs 2>&1 | tee "$NOCTELLA_CRASH_EVIDENCE_DIR/test-output.txt"

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - name: Test
        run: npm test --workspaces --if-present

      - name: Real PostgreSQL integration tests
        if: success() || failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/photo-crash-evidence"
          npm run test:postgres -w apps/api 2>&1 | tee "${{ runner.temp }}/photo-crash-evidence/postgres-repository-tests.txt"
        env:
          POSTGRES_TEST_DATABASE_URL: postgres://noctella_test:noctella_test_password@127.0.0.1:5432/noctella_sprint151_test

      - name: Build
        run: npm run build --workspaces --if-present
        env:
          # Next.js forces NODE_ENV=production while building. These safe non-production origins
          # exercise the production fail-closed contract without changing the Test step's runtime.
          STOREFRONT_SITE_URL: https://storefront.example.test
          NEXT_PUBLIC_API_BASE_URL: https://api.example.test

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Retain synthetic crash evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-crash-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/photo-crash-evidence/
          retention-days: 14
          if-no-files-found: warn

      - name: Preserve ownership experiment evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-operation-fencing-${{ github.run_id }}
          path: ${{ runner.temp }}/photo-fence-evidence/
          retention-days: 14
          if-no-files-found: warn
