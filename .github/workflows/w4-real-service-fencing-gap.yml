name: W4 real-service fail-closed regression
on:
  pull_request:
    branches: [test/w4-real-service-fencing-gap-424]
    paths:
      - scripts/photo-w4-fencing-gap/**
      - apps/api/src/use-cases/ai-intake-photo-finalize/useCases.ts
      - apps/api/src/services/photoOwnershipFencing.ts
      - .github/workflows/w4-real-service-fencing-gap.yml
permissions:
  contents: read
jobs:
  gap-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/shared
      - run: npm run typecheck -w apps/api
      - run: node --import tsx --test scripts/photo-w4-fencing-gap/real-w4.test.cjs
      - run: npm exec -w apps/api -- vitest run tests/photoOwnershipFencingSwitch.test.ts
