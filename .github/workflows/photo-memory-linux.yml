name: Photo memory Linux 512 MiB
on:
  workflow_dispatch:
    inputs:
      include_stress:
        description: Include the last bounded 144-MP stress case
        type: boolean
        default: true
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
    paths:
      - scripts/photo-memory-linux/**
      - .github/workflows/photo-memory-linux.yml
permissions:
  contents: read
concurrency:
  group: photo-memory-linux
  cancel-in-progress: false
jobs:
  tooling-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
      - run: node --test scripts/photo-memory-linux/policy.test.mjs

  benchmark:
    needs: tooling-tests
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'edited' &&
       github.event.changes.title &&
       startsWith(github.event.pull_request.title, '[run-photo-512m]') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INCLUDE_STRESS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_stress == false && 'false' || 'true' }}
      HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 7c6ab55237e996fef041c60bb06f45b7d0fc2061
          path: benchmark-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/api/src/scripts/photoMemoryBenchmark/
            /apps/api/src/services/photoStorage.ts
            /apps/api/src/services/errors.ts
      - uses: actions/setup-node@v7
        with:
          node-version: '20.20.0'
      - name: Prepare disposable context and source provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/photo-context/harness" "$RUNNER_TEMP/photo-context/source/scripts" "$RUNNER_TEMP/photo-context/source/services" "$RUNNER_TEMP/photo-evidence" "$RUNNER_TEMP/photo-fixtures" "$RUNNER_TEMP/photo-generator/tmp"
          cp scripts/photo-memory-linux/* "$RUNNER_TEMP/photo-context/harness/"
          cp -r benchmark-source/apps/api/src/scripts/photoMemoryBenchmark "$RUNNER_TEMP/photo-context/source/scripts/"
          cp benchmark-source/apps/api/src/services/{photoStorage,errors}.ts "$RUNNER_TEMP/photo-context/source/services/"
          sha256sum benchmark-source/apps/api/src/services/{photoStorage,errors}.ts benchmark-source/apps/api/src/scripts/photoMemoryBenchmark/*.ts > "$RUNNER_TEMP/photo-evidence/source-sha256.txt"
          docker info > "$RUNNER_TEMP/photo-evidence/docker-info.txt"
      - name: Build minimal pinned test image (dependency networking only)
        timeout-minutes: 8
        run: docker build -f scripts/photo-memory-linux/Dockerfile -t noctella-photo-memory:isolated "$RUNNER_TEMP/photo-context"
      - name: Generate five synthetic fixtures outside measured cgroups
        timeout-minutes: 8
        shell: bash
        run: |
          timeout --kill-after=10s 420s docker run --name "noctella-photo-generator-$GITHUB_RUN_ID" --rm --network none --memory 2g --memory-swap 2g --cpus 2 --pids-limit 128 --cap-drop ALL --security-opt no-new-privileges --read-only --user "$(id -u):$(id -g)" --mount "type=bind,src=$RUNNER_TEMP/photo-fixtures,dst=/fixtures" --mount "type=bind,src=$RUNNER_TEMP/photo-generator,dst=/work" noctella-photo-memory:isolated node --import tsx scripts/photo-memory-linux/agent.ts generate
          cp "$RUNNER_TEMP/photo-fixtures/fixtures.json" "$RUNNER_TEMP/photo-evidence/fixtures.json"
      - name: Run constrained cases and retain per-case evidence
        id: measure
        continue-on-error: true
        timeout-minutes: 20
        run: node scripts/photo-memory-linux/run-host.mjs "$RUNNER_TEMP/photo-evidence" "$RUNNER_TEMP/photo-fixtures"
      - name: Preserve and stop any container left by a step timeout
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/photo-evidence"
          for id in $(docker ps -aq --filter 'name=^/noctella-photo-'); do
            docker inspect "$id" > "$RUNNER_TEMP/photo-evidence/interrupted-$id.json" || true
            pid=$(docker inspect --format '{{.State.Pid}}' "$id")
            if [ "$pid" != 0 ] && [ -r "/proc/$pid/cgroup" ]; then
              cg=$(awk -F: '$1 == "0" {print $3}' "/proc/$pid/cgroup")
              for file in memory.max memory.swap.max memory.current memory.peak memory.events; do
                cat "/sys/fs/cgroup$cg/$file" > "$RUNNER_TEMP/photo-evidence/interrupted-$id-$file.txt" || true
              done
            fi
            docker rm --force "$id" || true
          done
      - name: Upload evidence even on OOM, enforcement failure or timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-memory-linux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/photo-evidence/
          retention-days: 14
          if-no-files-found: warn
      - name: Preserve failing status; artifact upload is not acceptance
        if: always()
        env:
          MEASUREMENT_OUTCOME: ${{ steps.measure.outcome }}
        run: test "$MEASUREMENT_OUTCOME" = success
